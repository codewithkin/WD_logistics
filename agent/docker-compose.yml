# Docker Compose for WD Logistics AI Agent (standalone — this service only)
#
# ENVIRONMENT VARIABLES:
#   For Render/production: Set env vars in the dashboard
#   For local dev with Docker: Create .env file or pass vars directly
#
# Usage (run from this agent/ directory):
#   docker-compose up -d

version: '3.8'

services:
  agent:
    build:
      # Context is the repo root (one level up), not agent/ itself —
      # Dockerfile's COPY paths are root-relative; see its header comment.
      context: ..
      dockerfile: agent/Dockerfile
    container_name: wd-logistics-agent
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WEB_APP_URL=${WEB_APP_URL:-http://localhost:3000}
      - AGENT_API_KEY=${AGENT_API_KEY}
      - MASTRA_LOG_LEVEL=${MASTRA_LOG_LEVEL:-info}
      # WhatsApp bot — disabled unless explicitly turned on (see src/index.ts)
      - ENABLE_WHATSAPP=${ENABLE_WHATSAPP:-false}
      - ADMIN_WHATSAPP_NUMBER=${ADMIN_WHATSAPP_NUMBER:-}
      - WHATSAPP_DEVELOPER_NUMBER_ONE=${WHATSAPP_DEVELOPER_NUMBER_ONE:-}
      - WHATSAPP_DEVELOPER_NUMBER_TWO=${WHATSAPP_DEVELOPER_NUMBER_TWO:-}
      - TEST_MODE=${TEST_MODE:-false}
    volumes:
      # Persist WhatsApp session data
      - whatsapp_auth:/app/.wwebjs_auth
    restart: unless-stopped
    healthcheck:
      # GET / is the only route guaranteed to respond — there's no /health
      # endpoint (see Dockerfile comment).
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Required for Puppeteer/Chromium
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined

volumes:
  whatsapp_auth:
    driver: local
